{% load static %}
<div class="col-lg-4 col-md-6 mb-4">

    <div class="card project-card h-100">

        <img src="{% static '' %}"
             class="card-img-top project-img"
             alt="Project Image">

        <div class="card-body d-flex flex-column">
            <h4 class="card-title fw-bold">
                Portfolio Website
            </h4>

            <p class="card-text text-muted">
                A modern responsive portfolio built using Django,
                Bootstrap, HTML, CSS and JavaScript.
            </p>

            <div class="mb-3">

                <span class="badge bg-dark">Python</span>

                <span class="badge bg-secondary">Django</span>

                <span class="badge bg-primary">Bootstrap</span>

                <span class="badge bg-success">JavaScript</span>

            </div>

            <div class="mt-auto d-flex justify-content-between">

                <a href="https://github.com/yourusername/project"
                   target="_blank"
                   class="btn btn-dark">
                    <i class="bi bi-github"></i> GitHub
                </a>

                <button class="btn btn-outline-dark"
                        data-bs-toggle="modal"
                        data-bs-target="#project1Modal">
                    View
                </button>

            </div>

        </div>

    </div>

</div>
